name: QA Post-Deploy E2E Smoke Tests

on:
  workflow_dispatch:
    inputs:
      qa_url:
        description: 'QA / Preview URL to test against (e.g., https://your-preview-url.vercel.app)'
        required: true
        type: string
        default: 'https://testing.k-hub.org.in'

  # Trigger when a deployment completes successfully on GitHub (if connected via Vercel integration)
  deployment_status:

jobs:
  smoke-test:
    name: Run E2E Against QA Deployment
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'Preview'))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright System Dependencies (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright Tests Against QA URL
        env:
          BASE_URL: ${{ github.event.inputs.qa_url || github.event.deployment_status.target_url }}
          CI: true
        run: npx playwright test

      - name: Upload QA Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-qa-report
          path: playwright-report/
          retention-days: 14
